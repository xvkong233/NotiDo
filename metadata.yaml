name: astrbot_plugin_notido
display_name: 知办 · NotiDo
short_desc: 让通知成为行动：滴答任务、周期待办与原生附件。
desc: >-
  复用 AstrBot 的 AI、当前会话与长期记忆，从中文通知、图片和文档中提炼本人待办。
  提供滴答清单查询、任务新建与修改、完成、周期任务、二次确认删除和原生附件工具，
  同时提供 /notido 指令及分组管理页面。任务与附件授权分别配置，操作仅限已授权会话和清单。
  需要 Node.js、dida-cli 和中国版滴答账号；扫描 PDF 读取还需要 Poppler。
version: 0.1.1
author: NotiDo contributors
repo: https://github.com/xvkong233/NotiDo
astrbot_version: ">=4.28.2,<4.29"
tags:
  - 效率
  - 滴答清单
  - 任务管理
  - 通知
