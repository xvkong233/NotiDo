name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install locked development dependencies
        run: |
          python -m pip install uv==0.11.28
          uv sync --frozen
          uv run --frozen playwright install --with-deps chromium
      - name: Check source and run local tests
        run: |
          uv run --frozen ruff check .
          uv run --frozen pytest -q
      - name: Build and validate release package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          uv run --frozen python -m tools.build_release --tag "$RELEASE_TAG" --output dist
          cd dist
          sha256sum --check *.zip.sha256
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path
          version = os.environ['RELEASE_TAG'][1:]
          changelog = Path('CHANGELOG.md').read_text('utf-8')
          match = re.search(r'^## ' + re.escape(version) + r'\s[^\n]*\n(.*?)(?=^## |\Z)', changelog, re.M | re.S)
          if not match:
              raise SystemExit('Missing changelog section for release version')
          notes = match.group(1).strip()
          repo = os.environ['GH_REPO']
          tag = os.environ['RELEASE_TAG']
          notes = re.sub(r'\]\((docs/[^)]+)\)', lambda m: f'](https://github.com/{repo}/blob/{tag}/{m[1]})', notes)
          Path('dist/release-notes.md').write_text(notes + '\n', encoding='utf-8')
          PY
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" dist/*.zip dist/*.zip.sha256 \
            --verify-tag --draft --title "NotiDo $RELEASE_TAG" \
            --notes-file dist/release-notes.md "${flags[@]}"
          gh release edit "$RELEASE_TAG" --draft=false
