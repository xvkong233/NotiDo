[project]
name = "astrbot-plugin-notido"
version = "0.1.1"
description = "Evidence-based personal notice tasks for AstrBot"
authors = [{name = "NotiDo contributors"}]
license = "GPL-3.0-only"
requires-python = ">=3.12,<3.15"
dependencies = [
  "pydantic>=2.12.5,<3", "SQLAlchemy[asyncio]>=2.0.41,<2.1",
  "aiosqlite>=0.21,<1", "pypdf>=6.1.1,<7", "python-docx>=1.2,<2",
  "Pillow>=11.2.1,<13", "filelock>=3.18,<4", "tzdata>=2025.2",
]

[project.urls]
Repository = "https://github.com/xvkong233/NotiDo"
Issues = "https://github.com/xvkong233/NotiDo/issues"
Documentation = "https://github.com/xvkong233/NotiDo/blob/main/README.md"

[dependency-groups]
dev = ["pytest>=8.4,<10", "pytest-asyncio>=1.1,<2", "ruff>=0.15,<1", "playwright==1.63.0", "mcp==1.30.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["E501"]
